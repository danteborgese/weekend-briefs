<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Brief</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231f3a5f%22/%3E%3Cpath%20d%3D%22M14%2042a18%2018%200%200%201%2036%200z%22%20fill%3D%22%23f6c445%22/%3E%3Crect%20x%3D%2210%22%20y%3D%2244%22%20width%3D%2244%22%20height%3D%224.5%22%20rx%3D%222.25%22%20fill%3D%22%23f8d77a%22/%3E%3Cpath%20d%3D%22M23%2031l6%206%2012-13%22%20fill%3D%22none%22%20stroke%3D%22%231f3a5f%22%20stroke-width%3D%225.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-title" content="Daily Brief">
<style>

:root{--navy:#1f3a5f;--gold:#f6c445;--bg:#f3f1ec;--ink:#1d2433;--muted:#6b7280;--line:#ece8df;--green:#2f7d4f;--greenTint:#eaf5ee;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 0 64px}
/* header */
header{background:var(--navy);color:#fff;padding:18px 22px 16px;border-radius:0 0 18px 18px}
@media(min-width:800px){header{border-radius:18px;margin-top:22px}}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand svg{width:28px;height:28px;border-radius:8px}
.sync{font-size:12px;color:#c9d6e8;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#7bd389;display:inline-block}
.switch{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:14px}
.switch button.arrow{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.switch button.arrow:hover{background:rgba(255,255,255,.1)}
.wk{text-align:center;min-width:180px}
.wk b{display:block;font-size:20px;letter-spacing:.2px}
.wk span{font-size:12px;color:#c9d6e8}
.jump{display:none;margin:6px auto 0;background:var(--gold);color:var(--navy);border:0;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.jump.show{display:block}
/* strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 0}
.d{background:rgba(255,255,255,.07);border:1px solid transparent;border-radius:12px;padding:7px 2px 8px;text-align:center;color:#fff;min-height:74px;display:flex;flex-direction:column;align-items:center;gap:3px}
.d .dn{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#c9d6e8}
.d .dd{font-size:17px;font-weight:700;line-height:1.1}
.d.we{background:rgba(123,211,137,.13)}
.d.today .dd{background:var(--gold);color:var(--navy);border-radius:999px;padding:0 7px}
.d.sel{border-color:#fff;background:rgba(255,255,255,.16)}
.d.past{opacity:.92}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:52px;min-height:9px}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.dot.f{background:currentColor}
.dot.r{background:repeating-linear-gradient(45deg,currentColor 0 1.5px,transparent 1.5px 3px)}
.dot.g{border-style:dashed;opacity:.55}
.more{font-size:10px;color:#c9d6e8}
.offtag{font-size:10px;color:#c9d6e8;font-style:italic}
/* sections */
main{padding:0 14px}
@media(min-width:800px){main{padding:0}}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.label{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
/* meter */
.meter{display:flex;gap:14px;align-items:center}
.grade{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:18px;line-height:1}
.grade small{font-size:9px;font-weight:600;color:var(--muted);margin-top:2px}
.mbody{flex:1;min-width:0}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mtop b{font-size:16px}
.mtop span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:#eeebe4;overflow:hidden;display:flex;margin:8px 0 6px}
.bar i{display:block;height:100%}
.hatch{background:repeating-linear-gradient(45deg,var(--gold) 0 4px,#fff3cc 4px 8px)}
.mnote{font-size:12.5px;color:#7a5d00}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:8px}
.wkp{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:#4b5563}.wkp b{color:var(--green)}
.bk{font-size:12.5px}
.bk .bl{display:flex;justify-content:space-between;gap:6px}
.bk .bl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bl span{color:var(--muted);white-space:nowrap}
.bk .bb{height:5px;border-radius:9px;margin-top:4px;display:flex;overflow:hidden}
details.more-b summary{list-style:none;cursor:pointer;font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
details.more-b summary::-webkit-details-marker{display:none}
/* day head */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 4px 0;gap:8px}
.dayhead h2{margin:0;font-size:22px;letter-spacing:-.2px}
.dayhead .sub{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;letter-spacing:.3px}
.banner{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner.hist{background:#eef1f6;color:#33476a}
.banner.fut{background:#fff7dc;color:#7a5d00}
.banner button{background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
/* weather + cal */
.wc{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media(min-width:640px){.wc{grid-template-columns:1.25fr 1fr}}
.wx{background:#fff8e6;border-radius:16px;padding:14px 16px}
.wx.we{background:#fffaf0}
.wxs{display:grid;grid-template-columns:1fr;gap:12px}
.wxs.two{grid-template-columns:1fr 1fr}
.wxc .city{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#a87600}
.wxc .t{display:flex;align-items:center;gap:10px;margin-top:2px}
.wxc .t svg{width:40px;height:40px;flex:none}
.wxc .t b{font-size:26px;color:var(--navy)} .wxc .t span{color:var(--muted)}
.tbar{position:relative;height:6px;border-radius:9px;background:#efe9da;margin:8px 0 2px}
.tbar i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#6aa9d6,#f2b544,#ee7d32)}
.rain{font-size:12px;color:#4b5563;display:flex;align-items:center;gap:6px;margin-top:6px}
.rain .rb{flex:1;height:4px;border-radius:9px;background:#e6edf5;overflow:hidden}.rain .rb i{display:block;height:100%;background:#5b8fd1}
.means{margin-top:10px;font-size:13px;border-left:3px solid var(--gold);padding-left:9px}
.cal{background:#eef4fb;border-radius:16px;padding:14px 16px}
.cal .ev{display:flex;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid #dde7f3}
.cal .ev:first-of-type{border-top:0}
.cal .ev .tm{flex:none;width:84px;color:#2f5b8f;font-weight:600;font-size:12.5px}
.cal .empty{font-size:13.5px;color:#4b5563;margin-top:4px}
/* oneline */
.one{margin:14px 4px 0;font-size:15.5px;font-weight:600;color:var(--navy);line-height:1.4}
/* blocks */
.block{margin-top:14px}
.bh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.bh b{font-size:13px;letter-spacing:.3px}
.bh span{font-size:12px;color:var(--muted)}
.task{display:flex;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px;border-left:4px solid var(--c,#999);position:relative}
.task .cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #cfc9bd;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px;padding:0}
.task.done .cb{background:var(--c);border-color:var(--c)}
.task.done .cb:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .tt{font-weight:600;font-size:14.5px}
.task.done .tt{color:#8a8f99;text-decoration:line-through;text-decoration-color:#c9c4b8}
.task .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.task .body{font-size:13px;color:#4b5563;margin-top:4px}
.task .body a{color:var(--c);font-weight:600}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:#fff1c7;color:#8a6200}
.badge.ok{background:#dff3e6;color:#22693f}
.badge.new{background:#e8eefc;color:#2a4fa0}
.badge.ip{background:#eef1f6;color:#33476a}
.task.ghost{background:transparent;border:1.5px dashed #d6d0c3;border-left:4px dashed var(--c);opacity:.75}
.task.ghost .tt{color:#8a8f99;font-weight:500}
.task.ghost .cb{visibility:hidden;width:0;margin:0;border:0}
.mv{background:none;border:0;padding:0;color:var(--c);font-weight:700;font-size:12px}
.task.ro .cb{cursor:default}
.add{display:flex;align-items:center;gap:8px;margin:12px 4px 0;background:none;border:1.5px dashed #d6d0c3;border-radius:14px;width:calc(100% - 8px);padding:11px 14px;color:var(--muted);font-size:14px;text-align:left}
.add:hover{border-color:#b9b2a3;color:var(--ink)}
/* off / weekend */
.off{background:#fff;border-radius:16px;padding:22px 18px;margin-top:14px;text-align:center}
.off h3{margin:6px 0 4px;font-size:18px;color:var(--navy)}
.off p{margin:0;color:#4b5563;font-size:14px}
.off small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
.wkd .task{--c:var(--green)}
.weline{color:var(--green)}
.when{font-size:11px;font-weight:700;color:var(--green);background:var(--greenTint);border-radius:999px;padding:1px 8px}
details.groc{background:var(--greenTint);border-radius:12px;margin-top:8px;padding:0 12px}
details.groc summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;display:flex;justify-content:space-between}
details.groc summary::-webkit-details-marker{display:none}
details.groc summary span{color:var(--muted);font-weight:500;font-size:13px}
.gl{columns:2;column-gap:18px;padding-bottom:12px;font-size:14px}
.gl label{display:flex;gap:8px;align-items:center;padding:3px 0;break-inside:avoid}
.gl input{accent-color:var(--green);width:17px;height:17px}
.gadd{display:flex;gap:8px;padding-bottom:14px}
.gadd input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.read{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f6f3ff;border-radius:14px;padding:12px 14px;margin-top:8px;font-size:13.5px;text-decoration:none}
.read b{display:block;font-size:14px;color:#4a2f80}
.summary{display:flex;gap:8px;margin-top:12px}
.summary div{flex:1;background:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.summary b{display:block;font-size:20px;color:var(--ink)}
footer{margin:26px 4px 0;font-size:12.5px;color:var(--muted);text-align:center}
footer em{display:block;color:var(--navy);font-style:normal;font-weight:600;font-size:13.5px;margin-bottom:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(18,28,45,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:17px}
.sheet input[type=text]{width:100%;border:1.5px solid #ddd6c8;border-radius:12px;padding:12px;font:inherit;font-size:16px}
.sheet .row{margin-top:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid #e2dccf;background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.we{color:var(--green)}
.chip.on.we{background:var(--green);border-color:var(--green);color:#fff}
.chip input[type=date]{border:0;font:inherit;font-size:13px;background:transparent;width:120px}
.bchip{display:inline-flex;align-items:center;gap:6px}
.bchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.bon{background:var(--t);border-color:var(--c)}
.seg{display:flex;background:#f1eee7;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
.sheet .go{margin-top:16px;width:100%;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;padding:0;font-size:13px}
.task .tt.ed{cursor:pointer}
.task .tt.ed:hover{text-decoration:underline;text-decoration-color:#d6d0c3;text-underline-offset:3px}
.task .dots3{position:absolute;top:8px;right:8px;border:0;background:none;color:#a39b8a;font-size:18px;line-height:1;padding:2px 6px;border-radius:8px;opacity:0;transition:opacity .15s}
.task:hover .dots3,.task .dots3:focus{opacity:1}
.task .dots3:hover{background:#f3f1ec}
.task .xdel{position:absolute;top:50%;right:6px;transform:translateY(-50%);border:0;background:none;color:#b3ab9b;font-size:17px;line-height:1;width:26px;height:26px;border-radius:50%;opacity:0;transition:opacity .15s,background .15s,color .15s}
.task:hover .xdel,.task .xdel:focus{opacity:1}
.task .xdel:hover{background:#fbe9e7;color:#c0392b}
.task .dots3{right:34px}
.task:hover{padding-right:62px}
@media(hover:none){.task .dots3,.task .xdel{display:none}.task:hover{padding-right:14px}}
.sheet textarea{width:100%;border:1.5px solid #ddd6c8;border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;resize:vertical;min-height:64px;margin-top:8px}
.del{display:none;margin:14px auto 0;background:none;border:0;color:#c0392b;font-size:14px;font-weight:600}
.del.show{display:block}
.sheet .x{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);margin-top:-4px}
.sync{transition:color .3s}
.sync.busy i{background:var(--gold);animation:pulse 1s infinite}
.sync.bot i{background:#7bd389;box-shadow:0 0 0 3px rgba(123,211,137,.25)}
@keyframes pulse{50%{opacity:.35}}
.mock{font-size:11px;text-align:center;color:#a39b8a;margin-top:10px}
.toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;padding:0;font-size:13px}
.task .tt.ed{cursor:pointer}
.task .tt.ed:hover{text-decoration:underline;text-decoration-color:#d6d0c3;text-underline-offset:3px}
.task .dots3{position:absolute;top:8px;right:8px;border:0;background:none;color:#a39b8a;font-size:18px;line-height:1;padding:2px 6px;border-radius:8px;opacity:0;transition:opacity .15s}
.task:hover .dots3,.task .dots3:focus{opacity:1}
.task .dots3:hover{background:#f3f1ec}
@media(hover:none){.task .dots3{display:none}}
.sheet textarea{width:100%;border:1.5px solid #ddd6c8;border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;resize:vertical;min-height:64px;margin-top:8px}
.del{display:none;margin:14px auto 0;background:none;border:0;color:#c0392b;font-size:14px;font-weight:600}
.del.show{display:block}
.sheet .x{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);margin-top:-4px}
.sync{transition:color .3s}
.sync.busy i{background:var(--gold);animation:pulse 1s infinite}
.sync.bot i,.sync.logged i{background:#7bd389;box-shadow:0 0 0 3px rgba(123,211,137,.25)}
.sync.err i,.sync.local i{background:#e0a03a}
@keyframes pulse{50%{opacity:.35}}
.task .body ul{margin:4px 0;padding-left:18px}
.task .body p{margin:4px 0}
.ghost .rec{color:#22693f}
.links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.wkl{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px}
.sheet{max-height:92vh;overflow:auto}
.strip{grid-template-columns:repeat(5,1fr) 1.35fr}
.d .dd.wkd{font-size:15px}
.ft{margin-top:18px}
.ft h3{margin:0 4px 8px;font-size:16px;letter-spacing:-.1px}
.ftc{border:1px solid #cfe6d3;border-radius:16px;overflow:hidden;background:#fff}
.fth{background:var(--fc,#2f7d4f);padding:16px 18px;color:#fff;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.fth .k{margin:0;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.78)}
.fth .tt2{margin:4px 0 0;font-size:20px;line-height:1.3;font-weight:700}
.ftb{padding:16px 18px;background:var(--fb,#f4fbf6);font-size:14px;line-height:1.5;color:#2b2b2b;overflow-wrap:anywhere}
.ftb table{width:100%}
.ftb td[width]{white-space:nowrap;padding-right:10px!important}
.went{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;margin-top:2px}
.went i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;display:inline-block;position:relative}
.went.on{background:#fff;color:var(--fc,#2f7d4f);border-color:#fff}
.went.on i{background:var(--fc,#2f7d4f);border-color:var(--fc,#2f7d4f)}
.went.on i:after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ftc.done .tt2{opacity:.85}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hrow">
    <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a4a74"/><path d="M14 42a18 18 0 0 1 36 0z" fill="#f6c445"/><rect x="10" y="44" width="44" height="4.5" rx="2.25" fill="#f8d77a"/><path d="M23 31l6 6 12-13" fill="none" stroke="#1f3a5f" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Brief</div>
    <div class="sync" id="sync"><i></i><span>Connecting…</span></div>
  </div>

s<\/a><\/p>\n      <\/details>\n    <\/div>\n  <\/div>\n<\/td><\/tr>\n\n<tr><td style=\"padding:20px 28px 0 28px;\"><div style=\"height:1px;background-color:#e8e5de;\"><\/div><\/td><\/tr>\n\n"}}, "2026-10-12": {"kind": "planned", "days": [{"date": "2026-10-12", "kind": "work", "steps": [{"id": "w41-wed-doers-trailer", "b": "doers", "t": "Channel trailer script", "e": "creative", "time": "", "body": "Rolled from Wednesday. The script comes first on the <a target=\"_blank\" rel=\"noopener\" href=\"https://app.notion.com/p/3f3cfd4a56ef81fa818acc43d8cead05\" style=\"color:#d08a00;font-weight:600;\">Doers Launch Checklist<\/a>, before filming and editing. Work from <a target=\"_blank\" rel=\"noopener\" href=\"https://app.notion.com/p/3f3cfd4a56ef814cba5ffff9a7d1e2ea\" style=\"color:#d08a00;font-weight:600;\">Material + Script v1<\/a>: what the show is and what the brand stands for, ending with a follow-and-rate ask. <strong>Done when:<\/strong> the trailer script is final and ready to film.", "date": "2026-10-12", "from": "Thu", "hops": 2, "origin": "Wed", "block": "b04cfd4a56ef8349976c018958507631"}, {"id": "w41-tue-doers-spotify", "b": "doers", "t": "Spotify launch plan", "e": "creative", "time": "", "body": "Third try, so it goes early while the trailer is fresh. Sunday Systems flags this as worthwhile for the system and sustainability. Sketch a one page launch plan for Doers on Spotify for Creators: what goes up first (the 15 back episodes once their final files are in Drive) and how it ties to the channel trailer so listeners can leave five star reviews early. If 40 minutes isn't enough, an outline counts. <strong>Done when:<\/strong> the one page plan (or a full outline) is written.", "date": "2026-10-12", "from": "Thu", "hops": 3, "origin": "Tue", "block": "667cfd4a56ef836f8c3f01e9dbc394da"}, {"id": "w41-thu-doers-hours", "b": "doers", "t": "Hours budget", "e": "creative", "time": "", "body": "From Sunday Systems: meditate on the right balance of learning, studying, and researching versus producing. If you have to read an entire book before making a video, that's too slow and too much work. How many hours a week can you spend on Doers and sustain for the next two years alongside a full-time job? <strong>Done when:<\/strong> one weekly hours number is written down, split into research and production.", "date": "2026-10-12", "from": "Thu", "hops": 1, "origin": "Thu", "block": "8accfd4a56ef8353adb78133e368a67b"}, {"id": "w41-thu-doers-bookmarks", "b": "doers", "t": "X bookmarks: where would AI interns go", "e": "creative", "time": "", "body": "From Sunday Systems: go through your X bookmarks. If you had interns, where would you apply them? Identify the limiting factors. Use the list under \"Addressing the Limiting Factor\" (sponsorships, expand to X, a TikTok editor, the Reading List lead magnet) as the frame. <strong>Done when:<\/strong> a short list of jobs an intern (or bot) would take, plus the single biggest limiting factor.", "date": "2026-10-12", "from": "Thu", "hops": 1, "origin": "Thu", "block": "89bcfd4a56ef83fd8a1d01191911d78a"}, {"id": "w41-thu-doers-team", "b": "doers", "t": "Deploy a full Grok Bot team", "e": "creative", "time": "", "body": "The sub-task under the bookmarks research. Using the intern list you just made, sketch the Grok Bot team: which jobs the bots you already have cover (Pre-Production for episode prep, Desk for the newsletter) and which gaps need a new bot. Pick the first new one to stand up. <strong>Done when:<\/strong> a roster with one job per bot, and the first new bot chosen.", "date": "2026-10-12", "from": "Thu", "hops": 1, "origin": "Thu", "block": "3f0cfd4a56ef807e8634f308e75a4aa0"}, {"id": "w41-thu-doers-os", "b": "doers", "t": "New system for running Doers", "e": "creative", "time": "", "body": "From Sunday Systems: come up with a new system for running this business. Start from the hours number and the bot roster you made this morning, and keep it to the first version (not Starship on day one). <strong>Done when:<\/strong> a one page sketch of the weekly rhythm: what you do, what the bots do, and when.", "date": "2026-10-12", "from": "Thu", "hops": 1, "origin": "Thu", "block": "3f0cfd4a56ef8003b1fae4128a6b5a1e"}, {"id": "w41-thu-job-apply", "b": "job", "t": "Submit the EliseAI application, then send the note", "e": "admin", "time": "", "body": "On the train. Step 8. The note in your shape: three bullets, one ask, the link in the third. A gift, not a critique. Submit the normal application on <a target=\"_blank\" rel=\"noopener\" href=\"https://jobs.ashbyhq.com/EliseAI/f0c8d0af-8021-4a04-b0f9-de1baff48ee4\" style=\"color:#2563b8;font-weight:600;\">Ashby<\/a> first, then send the note the same day. The assistant never sends either. Tell it when both are done (Stage: Applied and sent). Step 9, one bump four days later, lands next week (Mon Oct 12 at the earliest). If the write-up isn't ready, don't rush it; this moves to next week. <strong>Done when:<\/strong> application submitted and note sent, both today.", "date": "2026-10-12", "from": "Thu", "hops": 1, "origin": "Thu", "block": "3f1cfd4a56ef81d18bb6fbafbaeefa76"}, {"id": "w41-tue-ghd-fleetstar", "b": "ghd", "t": "Fleetstar | Webflow Scribes (14 standard + events)", "e": "admin", "time": "", "body": "Scripts and Ian's sheet are in. Test capture is still waiting on Ian's sandbox site answer (no reply as of this morning). For Ian's Oct 13, 2pm meeting. <a target=\"_blank\" rel=\"noopener\" href=\"https://app.notion.com/p/3f2cfd4a56ef81b5911fe7bc7a26d4e4\" style=\"color:#0f8b8d;font-weight:600;\">Tracker<\/a>", "date": "2026-10-12", "from": "Thu", "hops": 3, "origin": "Tue", "block": "5a7ae66e0ebc447bab9eca83a9ed5479"}, {"id": "w41-tue-ghd-union", "b": "ghd", "t": "Union (NEJB) | Webflow Scribes (14 standard + 4 client-specific)", "e": "admin", "time": "", "body": "Same scripts. Capture starts after the Fleetstar test is approved.", "date": "2026-10-12", "from": "Thu", "hops": 3, "origin": "Tue", y, then mostly clear<\/p>\n        <p style=\"margin:0;font-size:13px;color:#555;line-height:1.6;\">💧 Rain: <strong>0%<\/strong><br>💨 Wind: <strong>NE 5-9 mph<\/strong><\/p>\n      <\/div>\n    <\/td>\n    <td class=\"col\" width=\"50%\" valign=\"top\" style=\"padding:0 0 10px 6px;\">\n      <div style=\"background-color:#f1f3f5;border-radius:10px;padding:14px;\">\n        <p style=\"margin:0;font-size:12px;font-weight:700;color:#6b7c93;text-transform:uppercase;letter-spacing:1px;\">Sunday · Oct 4<\/p>\n        <p style=\"margin:6px 0 2px 0;font-size:28px;font-weight:700;color:#1f3a5f;\">🌦️ 64° <span style=\"font-size:16px;font-weight:500;color:#6b7c93;\">/ 57°<\/span><\/p>\n        <p style=\"margin:0 0 8px 0;font-size:14px;color:#2b2b2b;\">Partly sunny, chance of showers after 11am<\/p>\n        <p style=\"margin:0;font-size:13px;color:#555;line-height:1.6;\">💧 Rain: <strong>50%<\/strong> (0.10-0.25 in)<br>💨 Wind: <strong>E ~8 mph<\/strong><\/p>\n      <\/div>\n    <\/td>\n  <\/tr>\n  <\/table>\n  <p style=\"margin:4px 0 0 0;font-size:14px;line-height:1.5;color:#2b2b2b;\">→ <strong>Takeaway:<\/strong> Saturday is dry and 71°F. Sunday is a morning ride: be on the bike early, since showers are possible <strong>after 11am<\/strong>, and save indoor chores for the afternoon.<\/p>\n  <p style=\"margin:6px 0 0 0;font-size:11px;color:#9a9a9a;\">Source: <a target=\"_blank\" rel=\"noopener\" href=\"https://forecast.weather.gov/MapClick.php?lat=40.7831&amp;lon=-73.9712\" style=\"color:#9a9a9a;\">National Weather Service, Central Park NYC<\/a>, issued Oct 3, 2026 ~8:28 AM ET.<\/p>\n<\/td><\/tr>\n\n<tr><td style=\"padding:20px 28px 0 28px;\"><div style=\"height:1px;background-color:#e8e5de;\"><\/div><\/td><\/tr>\n\n<!-- Chores -->\n<tr><td style=\"padding:20px 28px 0 28px;\">\n  <h2 style=\"margin:0 0 4px 0;font-size:18px;color:#2b2b2b;\">🧺 Chores<\/h2>\n  <p style=\"margin:0 0 10px 0;font-size:13px;color:#8a8a8a;\">Quadrant 3 · 5 items<\/p>\n  <table role=\"presentation\" wi function baseSteps(){

    for(const d of w.days)for(const s of d.steps)out.push(Object.assign({},s));

function allEvents(){

}
let MODEL=null;
function buildModel(){

    if(!s)continue;

    if(e.action==="edit"){s.t=e.title;if(e.notes_changed)s.body=esc(e.notes||"");if(e.new_day&&e.new_day!==s.date){s.moved=true;s.date=e.new_day;s.time=""}
      if(e.bucket)s.b=e.bucket;if(e.energy)s.e=e.energy;s.edited=true;if(e.flexible){s.flex=true;s.fixed=null}}
    else if(e.action==="delete")del.add(s.id);

    else if(e.action==="uncheck")s.evDone=false;
  }
  const live=steps.filter(s=>!del.has(s.id)),byDate={};
  live.forEach(s=>(byDate[s.date]=byDate[s.date]||[]).push(s));
  MODEL={steps:live,byId:new Map(live.map(s=>[s.id,s])),byDate,deleted:del};
}
const blockOf=s=>s.ref&&s.ref.kind==="block"?s.ref.id:(s.block||null);

  const b=blockOf(s);if(b&&notionState[b]!==undefined)return notionState[b];

function weekData(m){

  for(let i=0;i<7;i++){const ds=add(m,i),dow=pd(ds).getDay();
    const bd=base.days.find(x=>x.date===ds)||{};
    const d=Object.assign({kind:dow===5?"off":(dow===6||dow===0)?"weekend":"work",ghosts:[]},bd,{date:ds});
    d.steps=(MODEL.byDate[ds]||[]).slice();
    if(d.kind==="weekend"){const we=weekendFor(m);if(we){d.wx=d.wx&&d.wx.length?d.wx:we.wx[ds];d.means=we.means;d.oneline=d.oneline||we.oneline;if(dow===0)d.read=we.read;d.weekendPath=we.path}}
    d.steps=d.steps.filter(s=>!hidePaused(s));

  const W2={kind:"weekend",isWeekend:true,date:sat.date,sun:sun.date,ghosts:[...sat.ghosts,...sun.ghosts],
    steps:[...sat.steps,...sun.steps],oneline:sat.oneline||sun.oneline||(we&&we.oneline)||"",means:we?we.means:"",read:we?we.read:null,weekendPath:we?we.path:null,
    wx:[sat,sun].flatMap(x=>(x.wx||[]).slice(0,1).map(w=>Object.assign({},w,{city:DL[pd(x.date).getDay()]+" · "+MN[pd(x.date).getMonth()]+" "+pd(x.date).getDate()}))),
    cal:[...(sat.cal||[]).map(c=>Object.assign({},c,{tm:"Sat "+c.tm})),...(sun.cal||[]).map(c=>Object.assign({},c,{tm:"Sun "+c.tm}))]};
  [...sat.steps,...sun.steps].filter(x=>x.fixed&&!x.trip).forEach(x=>W2.cal.push({tm:x.fixed,t:x.t}));
  days.splice(5,2,W2);
  const s=pd(m),e=pd(add(m,6));
  const label=MN[s.getMonth()]+" "+s.getDate()+" to "+(s.getMonth()===e.getMonth()?"":MN[e.getMonth()]+" ")+e.getDate();

}

let flushT=null,undoT=null;
function saveQ(){LS.set("brief2:outbox",outbox);LS.set("brief2:mine",mine.slice(-200))}
function queue(ev){
  ev.client_id="c"+rid();ev.ts=new Date().toISOString();outbox.push(ev);saveQ();
  setSync("busy");clearTimeout(flushT);flushT=setTimeout(flush,2500);return ev;
}
async function flush(){
  clearTimeout(flushT);
  if(!outbox.length){return}
  if(!SYNC){setSync("local");return}
  const batch=outbox.slice(0,30);
  try{
    const r=await fetch(SYNC+"/changes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({events:batch})});
    const j=await r.json();if(!r.ok||!j.results)throw new Error(j.error||("HTTP "+r.status));
    const failed=[];
    for(const res of j.results){
      const i=outbox.findIndex(e=>e.client_id===res.client_id);if(i<0)continue;
      const ev=outbox.splice(i,1)[0];
      if(res.ok){ev.ref_result=res.ref||null;ev.acked=Date.now();mine.push(ev)}else failed.push(ev.title||ev.task_id);
    }
    webhookState=j.webhook;saveQ();buildModel();render();
    if(failed.length)toast("Couldn't save “"+failed[0].slice(0,30)+"” to Notion");
    if(outbox.length){flushT=setTimeout(flush,800);return}
    setSync(j.webhook==="queued"?"bot":"logged");
    setTimeout(()=>{if(!outbox.length)setSync("ok")},9000);
    setTimeout(()=>refreshNotion(true),1500);
  }catch(e){setSync("err");flushT=setTimeout(flush,15000)}
}

  let g="";
  if(/grocer/i.test(s.t)&&(s.e==="x"||s.e==="rollover")){g=`<details class="groc" id="gdet"><summary>Grocery list <span>${grocLeft()} to get ▾</span></summary><div class="gl">${groc.items.map(x=>`<label><input type="checkbox" data-g="${esc(x.id)}" ${x.checked?"checked":""}>${esc(x.label)}</label>`).join("")}</div><div class="gadd"><input id="gin" placeholder="Add an item" maxlength="80"><button class="chip" id="gbtn">Add</button></div></details>`}
  return `<div class="task ${done?"done":""} ${ro?"ro":""}" style="--c:${b.c}"><button class="cb" data-id="${esc(s.id)}" aria-label="${done?"Mark not done":"Mark done"}"></button><div style="flex:1;min-width:0"><div class="tt ${ro?"":"ed"}" ${ro?"":`data-edit="${esc(s.id)}" role="button" tabindex="0"`}>${esc(s.t)}</div>${meta?`<div class="meta">${meta}</div>`:""}${s.body&&!done?`<div class="body">${s.body}</div>`:""}${g}</div>${ro?"":`<button class="dots3" data-edit="${esc(s.id)}" aria-label="Edit task" title="Edit">⋯</button><button class="xdel" data-del="${esc(s.id)}" aria-label="Delete task" title="Delete">×</button>`}</div>`;
}
function tripHTML(s,ro){
  const done=isDone(s),skipped=/skipped/i.test(s.kicker);
  return `<section class="ft"><h3>${esc(s.heading||"🗺️ Field Trip")}</h3><div class="ftc ${done?"done":""}" style="--fc:${esc(s.color)};--fb:${esc(s.tint)};${s.border?"border-color:"+esc(s.border):""}">
   <div class="fth"><div style="min-width:0"><p class="k">${esc(s.kicker)}</p><p class="tt2">${esc(s.t)}</p></div>
   ${skipped||(ro&&!done)?"":`<button class="went ${done?"on":""}" data-trip="${esc(s.id)}" aria-pressed="${done}" ${ro?"disabled":""} title="${ro?"Locked: use Fix a check":"Mark the field trip done"}"><i></i>${done?"Went":"Mark done"}</button>`}</div>
   <div class="ftb">${s.html}</div></div></section>`;
}
function renderDay(W){
  const d=W.days.find(x=>x.date===sel)||W.days[0];sel=d.date;
  const dt=pd(d.date),ro=W.history&&!editHist;
  const rel=d.isWeekend?(TODAY===d.date||TODAY===d.sun?"This weekend":TODAY<d.date&&mondayOf(TODAY)===wk?"Coming up":""):d.date===TODAY?"Today":d.date===add(TODAY,1)?"Tomorrow":d.date===add(TODAY,-1)?"Yesterday":"";
  let h=`<div class="dayhead"><div><div class="sub">${rel?rel+" · ":""}${d.isWeekend?weLab(d.date):MN[dt.getMonth()]+" "+dt.getDate()}</div><h2 class="${d.kind==="weekend"?"weline":""}">${d.isWeekend?"Weekend":DL[dt.getDay()]}</h2></div>`;
  const cnt=d.steps.filter(s=>!s.trip);if(cnt.length)h+=`<div class="sub">${cnt.filter(isDone).length} of ${cnt.length} done</div>`;
  h+="</div>";
  if(W.history)h+=`<div class="banner hist"><span>${editHist?"Editing history. Changes still sync to Notion.":"Looking back. Checks are locked so history stays honest."}</span><button id="editH">${editHist?"Done fixing":"Fix a check"}</button></div>`;
  else if(W.planned&&d.date===wk)h+=`<div class="banner fut"><span>Planned from next week's queue and Thursday's rollover. Times get added the morning of.</span></div>`;
  h+=weatherCal(d);
  if(d.date<TODAY&&d.kind==="work"&&!d.isWeekend&&(d.steps.length||d.ghosts.length)){const fin=d.steps.filter(isDone).length;h+=`<div class="summary"><div><b>${fin}</b>finished</div><div><b>${d.ghosts.length+d.steps.filter(s=>!isDone(s)).length}</b>rolled over or open</div></div>`}
  if(d.oneline)h+=`<div class="one ${d.kind==="weekend"?"weline":""}">${esc(d.oneline)}</div>`;
  if(d.kind==="off"&&!d.steps.length){
    h+=`<div class="off"><svg width="44" height="44" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fff4cf"/><path d="M14 30a10 10 0 0 1 20 0z" fill="#f6c445"/><rect x="11" y="30" width="26" height="2.5" rx="1.2" fill="#f6c445"/></svg><h3>Day off</h3><p>${esc(d.offNote&&d.offNote!==d.oneline?d.offNote:"Fridays are yours. Nothing scheduled, nothing owed.")}</p><small>Open steps from Thursday roll to Monday, never to today.</small></div>`;
  }else if(d.kind==="weekend"){
    const chores=d.steps.filter(s=>!s.trip),trips=d.steps.filter(s=>s.trip);
    h+=`<div class="block wkd"><div class="bh"><b class="weline">This weekend</b><span>${chores.filter(s=>!isDone(s)).length} left</span></div>${chores.map(s=>taskHTML(s,ro)).join("")||`<div class="hint" style="padding:0 4px">${W.history?"Nothing logged.":"Nothing yet. Weekend Chore Bot fills this in before the weekend."}</div>`}</div>`;
    trips.forEach(s=>{h+=tripHTML(s,ro)});
    if(d.read)h+=`<a class="read" href="${esc(d.read.url)}" target="_blank" rel="noopener"><span><b>📚 ${esc(d.read.t)}</b>${esc(d.read.s)}</span><span>›</span></a>`;
  }else{
    const energy=s=>s.e==="course"?"course":s.e==="rollover"?"rollover":s.e==="creative"?"creative":"admin";
    const gEnergy=g=>{const s=MODEL.byId.get(g.of);return s?energy(s):"creative"};
    const mk=(title,sub,arr,gh)=>arr.length||gh.length?`<div class="block"><div class="bh"><b>${title}</b><span>${esc(sub)}</span></div>${arr.map(s=>taskHTML(s,ro)).join("")}${gh.map(ghostHTML).join("")}</div>`:"";
    const by=k=>d.steps.filter(s=>energy(s)===k),gby=k=>d.ghosts.filter(g=>gEnergy(g)===k);
    h+=mk("☕ Before work","7:30 to 8:15",by("course"),[])+mk("↩ Weekend rollover","fit these in",by("rollover"),gby("rollover"))+mk("🎨 Morning · Creating","9:00 to 12:30",by("creative"),gby("creative").concat(gby("course")))+mk("🗂 Afternoon · Managing",d.managing||"1:30 to 3:00",by("admin"),gby("admin"));
    if(!d.steps.length&&!d.ghosts.length)h+=`<div class="hint" style="padding:10px 4px">${W.base.kind==="history-weekend"?"No daily brief that week.":"Nothing planned yet."}</div>`;
  }
  if(d.weekendPath)h+=`<a class="wkl" href="${esc(d.weekendPath)}" target="_blank" rel="noopener">Open the full weekend brief ›</a>`;
  if((d.isWeekend?d.sun:d.date)>=TODAY)h+=`<button class="add" data-add="${d.date}">＋ ${d.isWeekend?"Add to this weekend":d.kind==="off"?"Add something anyway":"Add to "+lab(d.date)}</button>`;
  $("#day").innerHTML=h;
  $("#day").querySelectorAll(".cb[data-id]").forEach(b=>b.onclick=()=>toggle(b.dataset.id,ro));
  $("#day").querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();const s=MODEL.byId.get(b.dataset.del);if(s)deleteStep(s)});
  $("#day").querySelectorAll("[data-trip]").forEach(b=>b.onclick=()=>toggle(b.dataset.trip,ro));
  $("#day").querySelectorAll("[data-edit]").forEach(b=>{b.onclick=e=>{e.stopPropagation();const s=MODEL.byId.get(b.dataset.edit);if(s)openSheet(s.date,s)};b.onkeydown=e=>{if(e.key==="Enter")b.click()}});
  $("#day").querySelectorAll(".mv").forEach(b=>b.onclick=()=>{const t=b.dataset.go;sel=normSel(t);wk=mondayOf(t);editHist=false;history.replaceState(null,"","#"+t);render();refreshNotion();window.scrollTo({top:0,behavior:"smooth"})});
  $("#day").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openSheet(b.dataset.add));
  const e=$("#editH");if(e)e.onclick=()=>{editHist=!editHist;render()};
  $("#day").querySelectorAll("[data-g]").forEach(c=>c.onchange=()=>{const it=groc.items.find(g=>g.id===c.dataset.g);if(it){it.checked=c.checked;grocSave();$("#gdet summary span").textContent=grocLeft()+" to get ▾"}});
  const gb=$("#gbtn");if(gb)gb.onclick=()=>{const v=$("#gin").value.trim().slice(0,80);if(!v)return;groc.items.push({id:"g"+rid(),label:v,checked:false});grocSave();render();$("#gdet").open=true};
}
function renderFoot(W){
  const base=W.base||{},links=[];
  if(base.notion_url)links.push(`<a href="${esc(base.notion_url)}" target="_blank" rel="noopener">Sunday Systems</a>`);
  links.push(`<a href="../">Classic daily brief</a>`);
  $("#foot").innerHTML=`<em>${esc(base.reminder||"Progress > Perfection.")}</em>Notion is the source of truth.<div class="links">${links.join("")}</div>`;
}

/* ---------- actions ---------- */
function toggle(id,ro){
  if(ro){toast("Tap “Fix a check” to change history");return}
  const s=MODEL.byId.get(id);if(!s)return;
  const now=!isDone(s);
  if(s.lsKey){try{now?localStorage.setItem(s.lsKey,"1"):localStorage.removeItem(s.lsKey)}catch(e){}}
  queue({action:now?"check":"uncheck",task_id:s.id,title:s.t,old_day:s.date,new_day:s.date,bucket:s.b,energy:s.e,ref:refOf(s)});
  const b=blockOf(s);if(b)notionState[b]=now;
  buildModel();render();
}
let aDay,aB="doers",aE="creative",editing=null;
function openSheet(day,step){
  editing=step||null;aDay=day;const w=pd(day).getDay(),we=w===6||w===0;
  aB=step?(B[step.b]?step.b:"admin"):(we?"chores":"doers");
  aE=step?(step.e==="admin"||step.e==="rollover"?"admin":"creative"):"creative";
  aDay=normSel(day);
  const opts=[];for(let i=0;i<15;i++){const o=normSel(add(TODAY,i));if(!opts.includes(o))opts.push(o)}if(!opts.includes(aDay))opts.push(aDay);opts.sort();
  $("#aDays").innerHTML=opts.map(o=>{const dw=pd(o).getDay(),wke=dw===6||dw===0,off=dw===5;
    const l=wke?(mondayOf(o)===THIS?"This weekend":mondayOf(o)===add(THIS,7)?"Next weekend":"Weekend "+md(o)+"–"+pd(add(o,1)).getDate()):o===TODAY?"Today":o===add(TODAY,1)?"Tomorrow":lab(o);return `<button class="chip ${wke?"we":""}" data-o="${o}" ${off?'style="opacity:.55"':""}>${l}${off?" · off":""}</button>`}).join("")+`<label class="chip">📅 <input type="date" id="aDate"></label>`;
  $("#aDays").querySelectorAll("[data-o]").forEach(c=>c.onclick=()=>{aDay=c.dataset.o;syncSheet()});
  $("#aDate").onchange=e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){aDay=normSel(e.target.value);syncSheet()}};
  $("#aBuckets").innerHTML=Object.entries(B).filter(([k])=>(k!=="course"&&!PAUSED.has(k))||(step&&step.b===k)).map(([k,b])=>`<button class="chip bchip" data-b="${k}" style="--c:${b.c};--t:${b.t}"><i></i>${esc(b.l)}</button>`).join("");
  $("#aBuckets").querySelectorAll("[data-b]").forEach(c=>c.onclick=()=>{aB=c.dataset.b;syncSheet()});
  $("#aTitle").value=step?step.t:"";$("#aNotes").value=step?plain(step.body):"";
  $("#aHead").textContent=step?"Edit task":"Add a task";$("#aSave").textContent=step?"Save":"Add";$("#aDel").classList.toggle("show",!!step);
  syncSheet();$("#scrim").classList.add("open");if(!step)setTimeout(()=>$("#aTitle").focus(),50);
}
function syncSheet(){
  $("#aDays").querySelectorAll("[data-o]").forEach(c=>c.classList.toggle("on",c.dataset.o===aDay));
  const lbl=$("#aDays label");if(lbl)lbl.classList.toggle("on",![...$("#aDays").querySelectorAll("[data-o]")].some(c=>c.dataset.o===aDay));
  $("#aBuckets").querySelectorAll("[data-b]").forEach(c=>c.classList.toggle("bon",c.dataset.b===aB));
  const w=pd(aDay).getDay(),we=w===6||w===0;
  $("#aBlockRow").style.display=we?"none":"";
  $("#aBlock").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===aE));
  const hasPage=!!(DATA.weeks[mondayOf(aDay)]&&DATA.weeks[mondayOf(aDay)].notion_page_id);
  $("#aHint").textContent=(we?"One shared weekend list: do it whichever day the weather suits. ":"")+(hasPage?"Saved to that week's Sunday Systems page.":`Week of ${md(mondayOf(aDay))}: saved to the Notion Brief queue until that week's Sunday Systems page exists.`);
}
$("#aBlock").querySelectorAll("button").forEach(b=>b.onclick=()=>{aE=b.dataset.v;syncSheet()});
$("#scrim").onclick=e=>{if(e.target.id==="scrim")$("#scrim").classList.remove("open")};
$("#aClose").onclick=()=>$("#scrim").classList.remove("open");
$("#aSave").onclick=()=>{
  const t=$("#aTitle").value.trim().slice(0,300);if(!t){$("#aTitle").focus();return}
  const w=pd(aDay).getDay(),we=w===6||w===0,notes=$("#aNotes").value.trim();
  const energy=editing&&(editing.e==="course"||editing.e==="rollover"||editing.e==="x"&&we)?editing.e:(we?"x":aE);
  if(editing){const s=editing;
    const nc=notes!==plain(s.body);
    const keep=we&&isWE(s.date)&&satOf(s.date)===aDay;const nd=keep?s.date:aDay;
    queue({action:"edit",task_id:s.id,title:t,old_title:s.t,notes,notes_changed:nc,old_day:s.date,new_day:nd,bucket:aB,energy,ref:refOf(s),flexible:we&&!keep?true:!!s.flex});
    $("#scrim").classList.remove("open");buildModel();wk=mondayOf(aDay);sel=aDay;history.replaceState(null,"","#"+aDay);render();
    toast(nd!==s.date?"Moved to "+(we?"the weekend":lab(aDay)):"Saved");return}
  const id="t-"+rid();
  queue({action:"add",task_id:id,title:t,notes,notes_changed:true,old_day:null,new_day:aDay,bucket:aB,energy,flexible:we});
  $("#scrim").classList.remove("open");buildModel();wk=mondayOf(aDay);sel=aDay;history.replaceState(null,"","#"+aDay);render();toast("Added to "+(we?"the weekend":lab(aDay)));
};
$("#aDel").onclick=()=>{if(editing)deleteStep(editing)};
function deleteStep(s){
  const ev=queue({action:"delete",task_id:s.id,title:s.t,old_day:s.date,new_day:null,bucket:s.b,energy:s.e,ref:refOf(s)});
  $("#scrim").classList.remove("open");buildModel();render();
  toast("Deleted “"+(s.t.length>26?s.t.slice(0,26)+"…":s.t)+"”",()=>{
    const i=outbox.findIndex(e=>e.client_id===ev.client_id);
    if(i>=0){outbox.splice(i,1);saveQ();if(!outbox.length){clearTimeout(flushT);setSync("ok")}}
    else queue({action:"restore",task_id:s.id,title:s.t,old_day:null,new_day:s.date,bucket:s.b,energy:s.e,ref:refOf(s)});
    buildModel();render();toast("Restored")});
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#scrim").classList.remove("open");if(e.key==="Enter"&&e.target.id==="aTitle")$("#aSave").click()});
function toast(m,undo){const t=$("#toast");t.textContent=m;t.classList.toggle("act",!!undo);
  if(undo){const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{t.classList.remove("show","act");undo()};t.appendChild(b)}
  t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show","act"),undo?5000:1800)}

/* ---------- nav + boot ---------- */
function goWeek(n){wk=add(wk,7*n);editHist=false;sel=wk===THIS?TODAY:wk;history.replaceState(null,"","#"+sel);render();refreshNotion(true);refreshWeekend(wk)}
$("#prev").onclick=()=>goWeek(-1);$("#next").onclick=()=>goWeek(1);
$("#jump").onclick=()=>{wk=THIS;sel=TODAY;editHist=false;history.replaceState(null,"","#"+sel);render();refreshNotion(true)};
let tx=null;document.querySelector("header").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
document.querySelector("header").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)goWeek(dx<0?1:-1);tx=null});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&normSel(h)!==sel){wk=mondayOf(h);sel=normSel(h);editHist=false;render();refreshNotion(true)}});
window.addEventListener("focus",()=>{refreshNotion();refreshServer();grocPull()});
window.addEventListener("storage",e=>{if(e.key===GK){groc=LS.get(GK,groc);render()}});
setInterval(()=>{if(document.visibilityState==="visible")refreshNotion()},45000);
buildModel();setSync(SYNC?(outbox.length?"busy":"ok"):"local");render();
if(outbox.length)flush();
refreshServer();refreshNotion(true);grocPull();refreshWeekend(THIS);if(wk!==THIS)refreshWeekend(wk);
</script>
</body>
</html>
